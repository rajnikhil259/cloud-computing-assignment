apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cmdparser
  namespace: app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cmdparser
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70      # of the 500m CPU request
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 60  # default is 300 s; shortened so the demo fits one run
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
