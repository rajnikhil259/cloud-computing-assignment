# Traefik (bundled with k3s) routes /parse to the Service; k3d maps localhost:8080 -> port 80.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cmdparser
  namespace: app
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /parse
            pathType: Exact
            backend:
              service:
                name: cmdparser
                port:
                  name: http
